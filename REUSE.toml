    "LICENSE",
    "README.md",
    "AGENTS.md",
    "PUBLIC_RELEASE_CHECKLIST.md",
    "RIGHTS.md",
    "THIRD_PARTY_NOTICES.md",
    "docs/**",
    "hardware/**/*.md",
    "hardware/**/*.png",
    "hardware/**/*.svg",
    "manufacturing/LICENSE.md",
    "manufacturing/**/*.png",
    "firmware/LICENSE.md",
    "firmware/pico2-drv8835/README.md",
    "firmware/pico2-drv8835/docs/**",
    "generator/LICENSE.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 pscmps"
SPDX-License-Identifier = "CC-BY-4.0"

