version = 1
SPDX-PackageName = "Planar Stepper Flex"
SPDX-PackageSupplier = "pscmps <https://github.com/pscmps>"
SPDX-PackageDownloadLocation = "https://github.com/pscmps/planar-stepper-flex"

[[annotations]]
path = [
    "hardware/**/*.kicad_pcb",
    "hardware/**/*.kicad_pro",
    "hardware/**/*.json",
    "hardware/**/*.csv",
    "hardware/**/fp-lib-table",
    "generator/assets/*.kicad_mod",
    "manufacturing/**/*.zip",
    "manufacturing/**/*.csv",
    "manufacturing/**/*.rpt",
    "manufacturing/**/SHA256SUMS.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 pscmps"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

[[annotations]]
path = [
    "firmware/pico2-drv8835/CMakeLists.txt",
    "firmware/pico2-drv8835/src/**",
    "firmware/pico2-drv8835/include/**",
    "firmware/pico2-drv8835/tests/**",
    "firmware/pico2-drv8835/web/**",
    "firmware/pico2-drv8835/tools/**",
    "firmware/pico2-drv8835/examples/**",
    "generator/*.py",
    "generator/planar_stepper/**",
    "generator/tests/**",
    "hardware/**/*.py",
    "scripts/**",
    ".gitattributes",
    ".gitignore",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 pscmps"
SPDX-License-Identifier = "MIT"

[[annotations]]
